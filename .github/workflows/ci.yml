name: CI

on:
  push:
    branches:
      - main
      - master
      - feat-modular-monolith-architecture-review
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-only-database-password
      REDIS_PASSWORD: ci-only-redis-password
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      DB_SSL: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build --tag school-management-api:ci .

      - name: Build test image
        run: docker compose --profile test build test

      - name: Run tests in Docker Compose
        run: docker compose --profile test run --rm test

      - name: Stop services
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
