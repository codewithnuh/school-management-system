version: '3.8'

services:
    # PostgreSQL Database
    postgres:
        image: postgres:15-alpine
        container_name: school_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: school_management
            POSTGRES_USER: school_admin
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - '${DB_PORT:-5432}:5432'
        networks:
            - school_network
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U school_admin -d school_management']
            interval: 10s
            timeout: 5s
            retries: 5

    # Redis Cache
    redis:
        image: redis:7-alpine
        container_name: school_redis
        restart: unless-stopped
        command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
        volumes:
            - redis_data:/data
        ports:
            - '${REDIS_PORT:-6379}:6379'
        networks:
            - school_network
        healthcheck:
            test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    # Application
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: school_app
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
            DB_DIALECT: postgres
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: school_management
            DB_USER: school_admin
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
            DB_SSL: ${DB_SSL:-false}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
            JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
            TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
        ports:
            - '${APP_PORT:-3000}:3000'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - school_network
        volumes:
            - ./logs:/app/logs
        command: sh -c "node dist/app.js"

    # Development App (optional)
    app-dev:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: school_app_dev
        profiles:
            - development
        environment:
            NODE_ENV: development
            PORT: 3000
            DB_DIALECT: postgres
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: school_management
            DB_USER: school_admin
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
            DB_SSL: ${DB_SSL:-false}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
            JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
            JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
            CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
            TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
        ports:
            - '3000:3000'
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            - postgres
            - redis
        networks:
            - school_network
        command: ['pnpm', 'run', 'dev']

    # Test Runner
    test:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: school_test
        profiles:
            - test
        environment:
            NODE_ENV: test
            DB_DIALECT: postgres
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: school_management_test
            DB_USER: school_admin
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
            DB_SSL: ${DB_SSL:-false}
            JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
        depends_on:
            - postgres
            - redis
        networks:
            - school_network
        command: ['pnpm', 'run', 'test']

    # Database Migration Runner
    migrate:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: school_migrate
        environment:
            NODE_ENV: production
            DB_DIALECT: postgres
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: school_management
            DB_USER: school_admin
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
            DB_SSL: ${DB_SSL:-false}
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - school_network
        command: ['pnpm', 'run', 'migrate']

networks:
    school_network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
